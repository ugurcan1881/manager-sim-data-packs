name: Process Data Pack Submission

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Submission issue number to process again"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: data-pack-catalog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.state == 'open' && !github.event.issue.pull_request && contains(github.event.issue.body, '### Mod Name') && contains(github.event.issue.body, '### GitHub Release URL'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validator tests
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"

      - name: Validate submission and create pack metadata
        id: submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_RESULT_PATH: .submission-result.json
        run: python3 .github/scripts/process_submission.py

      - name: Build catalog.json
        run: python3 .github/scripts/build_catalog.py

      - name: Commit validated Data Pack
        run: |
          git config user.name "Football Club Manager Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packs catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git commit -m "Add or update validated community Data Pack"
          git push

      - name: Comment on and close submission issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_RESULT_PATH: .submission-result.json
        run: python3 .github/scripts/process_submission.py --finalize

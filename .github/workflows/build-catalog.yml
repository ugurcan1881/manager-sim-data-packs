name: Build Data Pack Catalog

on:
  push:
    branches:
      - main
    paths:
      - "packs/**"
      - "featured.json"
      - ".github/scripts/build_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pack-catalog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build catalog.json
        run: python3 .github/scripts/build_catalog.py

      - name: Commit catalog.json
        run: |
          git config user.name "Football Club Manager Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
            exit 0
          fi

          git commit -m "Update Data Pack catalog"
          git push

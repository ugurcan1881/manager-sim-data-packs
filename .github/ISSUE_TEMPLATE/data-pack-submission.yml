name: "Submit Data Pack"
description: "Share your Football Club Manager Data Pack"
title: "[DATA PACK] "

body:
  - type: input
    id: pack_name
    attributes:
      label: "Mod Name"
      description: "Enter the name of your Data Pack."
      placeholder: "Example: 2026/27 Real Data Pack"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: "Author"
      description: "Enter your name or username."
      placeholder: "Example: FootballFan"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Briefly explain what your Data Pack changes."
      placeholder: "Example: Updates player names, club names, competitions, stadiums and logos."
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: "GitHub Release URL"
      description: "Paste the GitHub Release page where your Data Pack ZIP is uploaded."
      placeholder: "https://github.com/username/repository/releases/tag/v1.0.0"
    validations:
      required: true

    - type: checkboxes
    id: confirmation
    attributes:
      label: "Confirmation"
      description: "Please confirm the following."
      options:
        - label: "I am responsible for the content included in this Data Pack."
          required: true

        - label: "I confirm that I have the necessary rights or permissions to distribute the content included in this Data Pack."
          required: true

        - label: "I understand that this Data Pack may be removed if it violates the rules or receives a valid rights complaint."
          required: true
